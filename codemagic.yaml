workflows:
  ios-unsigned-ipa:
    name: Build Unsigned iOS IPA (For Sideloadly)
    max_build_duration: 30
    instance_type: mac_mini_m1
    working_directory: companion_app
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate and configure iOS project
        script: |
          # 1. Sao lưu cấu hình riêng của app (Info.plist, AppDelegate)
          cp ios/Runner/Info.plist /tmp/Info.plist
          cp ios/Runner/AppDelegate.swift /tmp/AppDelegate.swift

          # 2. Tạo Xcode project scaffolding nguyên bản
          flutter create . --platforms=ios --org com.gt3nav

          # 3. Phục hồi cấu hình quyền & bridge
          cp /tmp/Info.plist ios/Runner/Info.plist
          cp /tmp/AppDelegate.swift ios/Runner/AppDelegate.swift

          # 4. Cấu hình unsigned build an toàn qua .xcconfig (Chuẩn Apple/Flutter, không can thiệp pbxproj)
          echo "DEVELOPMENT_TEAM = ABC123XYZ8" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY =" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED = NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_ALLOWED = NO" >> ios/Flutter/Release.xcconfig

          echo "DEVELOPMENT_TEAM = ABC123XYZ8" >> ios/Flutter/Debug.xcconfig
          echo "CODE_SIGN_IDENTITY =" >> ios/Flutter/Debug.xcconfig
          echo "CODE_SIGNING_REQUIRED = NO" >> ios/Flutter/Debug.xcconfig
          echo "CODE_SIGNING_ALLOWED = NO" >> ios/Flutter/Debug.xcconfig

          # 5. Tải Flutter packages
          flutter packages pub get
      - name: Build iOS Release (No Codesign)
        script: |
          flutter build ios --release --no-codesign || {
            echo "Fallback to direct xcodebuild..."
            xcodebuild -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          }
      - name: Package Unsigned .ipa for Sideloadly
        script: |
          APP_PATH=$(find . -name "Runner.app" -type d | grep -E "Release|iphoneos" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found!"
            find . -name "*.app" -type d
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r GT3Nav_unsigned.ipa Payload
          cp GT3Nav_unsigned.ipa ..
    artifacts:
      - companion_app/GT3Nav_unsigned.ipa
      - GT3Nav_unsigned.ipa
      - "*.ipa"
      - "**/*.ipa"
