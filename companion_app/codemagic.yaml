workflows:
  ios-unsigned-ipa:
    name: Build Unsigned iOS IPA (For Sideloadly)
    max_build_duration: 30
    instance_type: mac_mini_m1
    working_directory: companion_app
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate and configure iOS project
        script: |
          # 1. Sao lưu cấu hình riêng của app
          cp ios/Runner/Info.plist /tmp/Info.plist
          cp ios/Runner/AppDelegate.swift /tmp/AppDelegate.swift

          # 2. Tạo đầy đủ Xcode project scaffolding cho iOS
          flutter create . --platforms=ios --org com.gt3nav

          # 3. Phục hồi cấu hình quyền & bridge
          cp /tmp/Info.plist ios/Runner/Info.plist
          cp /tmp/AppDelegate.swift ios/Runner/AppDelegate.swift

          # 4. Lấy Flutter dependencies
          flutter packages pub get
      - name: Build iOS Release (No Codesign)
        script: |
          # Bơm DEVELOPMENT_TEAM và tắt code signing trong project.pbxproj để vượt qua kiểm tra của Flutter
          python3 -c '
          import re
          with open("ios/Runner.xcodeproj/project.pbxproj", "r") as f:
              text = f.read()
          text = re.sub(
              r"(PRODUCT_BUNDLE_IDENTIFIER = [^;]+;)",
              r"\1\n\t\t\t\tDEVELOPMENT_TEAM = A1B2C3D4E5;\n\t\t\t\tCODE_SIGN_IDENTITY = \"\";\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;",
              text
          )
          with open("ios/Runner.xcodeproj/project.pbxproj", "w") as f:
              f.write(text)
          '

          # Biên dịch release không cần code signing
          flutter build ios --release --no-codesign || {
            echo "Flutter CLI blocked on signing check. Falling back to direct xcodebuild..."
            xcodebuild -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          }
      - name: Package Unsigned .ipa for Sideloadly
        script: |
          APP_PATH=$(find . -name "Runner.app" -type d | grep -E "Release|iphoneos" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found!"
            find . -name "*.app" -type d
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r GT3Nav_unsigned.ipa Payload
          cp GT3Nav_unsigned.ipa ..
    artifacts:
      - companion_app/GT3Nav_unsigned.ipa
      - GT3Nav_unsigned.ipa
      - "*.ipa"
      - "**/*.ipa"
